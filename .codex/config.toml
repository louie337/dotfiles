model_provider = "datax-codex-lb"
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
sandbox_mode = "workspace-write"
approvals_reviewer = "auto_review"
plan_mode_reasoning_effort = "max"

[sandbox_workspace_write]
writable_roots = [
    "/Users/louie/Documents/subanana/subanana-main",
    "/Users/louie/Documents/subanana/subanana-main/.agents",
    "/Users/louie/Documents/subanana/subanana-devops-main",
    "/Users/louie/Library/Application Support/glab-cli",
]

[features]
apps = false

[agents]
max_threads = 6
max_depth = 1

[tui]
notifications = true
notification_method = "auto"
notification_condition = "always"
status_line = ["model-with-reasoning", "git-branch", "pull-request-number", "run-state", "permissions", "approval-mode", "context-remaining", "used-tokens", "task-progress"]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4

[model_providers.datax-codex-lb]
name = "OpenAI"  # required — enables remote /responses/compact
base_url = "https://sg.datax.io/backend-api/codex"
wire_api = "responses"
env_key = "DATAX_OPENAI_API_KEY"
supports_websockets = true
requires_openai_auth = false

[model_providers.subanana]
name = "Subanana"
base_url = "https://llmapi.subanana.dev/"
wire_api = "responses"
env_key = "SUBANANA_OPENAI_API_KEY"
requires_openai_auth = false

[projects."/Users/louie/Documents/emsd/tv-meels-sss/main"]
trust_level = "trusted"

[projects."/Users/louie/dotfiles"]
trust_level = "trusted"

[projects."/Users/louie/Documents/subanana/subanana-main"]
trust_level = "trusted"

[projects."/Users/louie/Documents/local-vpn-proxy"]
trust_level = "trusted"

[projects."/Users/louie/Documents/doj/doj-jafpars"]
trust_level = "trusted"

[projects."/Users/louie/Documents/subanana/subanana-devops-main"]
trust_level = "trusted"

[projects."/Users/louie/Documents/fsd/fsd-walkie-talkie"]
trust_level = "trusted"

[projects."/Users/louie/Documents/dh/dh-form-2"]
trust_level = "trusted"

[projects."/Users/louie/Documents/open-connector"]
trust_level = "trusted"

[projects."/Users/louie/Documents/emsd/tv-meels-sss"]
trust_level = "trusted"

[projects."/Users/louie/Documents/subanana/subanana-main/landing"]
trust_level = "trusted"

[projects."/Users/louie/Documents/fehd/fehd-rodent-detection/fehd-rodent-detection-main"]
trust_level = "trusted"

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"

[mcp_servers.artifact-drop]
command = "node"
args = ["/Users/louie/Documents/subanana/artifact-drop/mcp/server.mjs"]
env_vars = ["ARTIFACT_DROP_TOKEN"]

[mcp_servers.chrome-devtools]
command = "npx"
# Attach to the running Chrome instance only.  Supplying the real user-data
# directory makes chrome-devtools-mcp read its DevToolsActivePort instead of
# falling back to its own ~/.cache/chrome-devtools-mcp profile. Keep the version
# pinned so a future MCP release cannot silently change this fail-closed behavior.
args = ["-y", "chrome-devtools-mcp@1.8.0", "--auto-connect", "--user-data-dir=/Users/louie/Library/Application Support/Google/Chrome"]

[mcp_servers.subanana-data-analytics]
url = "https://mcp.subanana.com"
bearer_token_env_var = "MCP_SHARED_KEY"

[mcp_servers.subanana-data-analytics-dev]
url = "https://dev-mcp.subanana.com"
bearer_token_env_var = "MCP_SHARED_KEY_DEV"

[mcp_servers.subanana-mr]
url = "https://mcp.mr.subanana.dev/mcp"
bearer_token_env_var = "MCP_SHARED_KEY_MR"

[mcp_servers.posthog]
url = "https://mcp.posthog.com/mcp"
enabled = false

[mcp_servers.openconnector]
url = "http://127.0.0.1:3456/mcp"

[notice.model_migrations]
"gpt-5.4-mini" = "gpt-5.6-luna"
